name: Release
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Release package"
        required: true
        type: choice
        options:
          - "@govuk-one-login/alpha-component"
          - "@govuk-one-login/event-catalogue-utils"
          - "@govuk-one-login/frontend-analytics"
          - "@govuk-one-login/frontend-language-toggle"
          - "@govuk-one-login/frontend-passthrough-headers"
          - "@govuk-one-login/frontend-vital-signs"
          - "@govuk-one-login/frontend-ui"
          - "@govuk-one-login/frontend-asset-loader"
          - "@govuk-one-login/frontend-device-intelligence"
          - "@govuk-one-login/frontend-logger"

      increment:
        description: "Increment"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

      first_release:
        description: "First release (from this repo)"
        required: true
        default: false
        type: boolean

      dry_run:
        description: "Dry run?"
        required: true
        default: false
        type: boolean

run-name: Release ${{ github.event.inputs.target }} ${{ github.event.inputs.increment }} ${{ github.event.inputs.first_release == 'true' && '--first-release' || '' }} ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

# Needed for nx-set-shas when run on the main branch
permissions:
  actions: read
  contents: write
  id-token: write # needed for provenance data generation

jobs:
  prepare-branch-for-main:
    name: Prepare branch for main
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.PUBLISHER_APP_ID }}
          private-key: ${{ secrets.PUBLISHER_APP_SECRET }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: ./.github/actions/setup-node
        with:
          token: ${{ secrets.GH_PACKAGES_TOKEN }}

      # required set up steps for Github architecture
      - run: npm i @rollup/rollup-linux-x64-gnu --no-save
      - run: npm i @nx/nx-linux-x64-gnu --no-save

      - name: Set SHAs for affected packages
        uses: nrwl/nx-set-shas@v4

      - name: Print Environment Information
        run: npx nx report

      - name: Configure git user
        run: |
          git config --global user.email "226340596+govuk-one-login-frontend-publisher[bot]@users.noreply.github.com"
          git config --global user.name "govuk-one-login-frontend-publisher[bot]"

      - name: Detect channel branch
        id: channel
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          if [[ "$BRANCH" =~ ^.+@v[0-9]+(\.[0-9]+)*/.+$ ]]; then
            CHANNEL_NAME="${BRANCH##*/}"
            echo "is_channel=true" >> "$GITHUB_OUTPUT"
            echo "name=$CHANNEL_NAME" >> "$GITHUB_OUTPUT"
            echo "Detected channel branch: channel=$CHANNEL_NAME"
          else
            echo "is_channel=false" >> "$GITHUB_OUTPUT"
            echo "Not a channel branch"
          fi

      - name: Resolve package directory
        id: pkg
        run: echo "dir=${TARGET##*/}" >> "$GITHUB_OUTPUT"
        env:
          TARGET: ${{ github.event.inputs.target }}

      - name: Version packages
        id: version
        if: ${{ github.ref == 'refs/heads/main' || contains(github.ref, '@v') }}
        run: |
          set -o pipefail
          # Capture the Nx output (also echoed to the log via tee) so we can read
          # the planned version from it. We must NOT read it back from
          # package.json, because on a --dry-run Nx only previews the bump and
          # never writes the new version to disk - so package.json would still
          # hold the current (already-released) version, and the changelog step
          # would then be asked to generate an entry for a version that already
          # exists and report "no changes detected".
          if [ "${{ steps.channel.outputs.is_channel }}" = "true" ]; then
            npx nx release version prerelease \
              --preid=${{ steps.channel.outputs.name }} \
              --projects=${{ github.event.inputs.target }} \
              ${{ github.event.inputs.first_release == 'true' && '--first-release' || '' }} \
              ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
              2>&1 | tee version-output.log
          else
            npx nx release version ${{ github.event.inputs.increment }} \
              --projects=${{ github.event.inputs.target }} \
              ${{ github.event.inputs.first_release == 'true' && '--first-release' || '' }} \
              ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
              2>&1 | tee version-output.log
          fi
          # Nx prints a line like:
          #   <project> ✍  New version 4.2.4 written to manifest: packages/.../package.json
          # This is emitted on both real and dry runs and for both standard and
          # prerelease/channel bumps, so it is the reliable source of truth.
          NEW_VERSION="$(sed 's/\x1b\[[0-9;]*m//g' version-output.log \
            | grep -oE 'New version [^ ]+ written' | head -n1 | awk '{print $3}')"
          if [ -z "$NEW_VERSION" ]; then
            echo "::error::Could not resolve the new version from nx release version output" >&2
            exit 1
          fi
          echo "number=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version for changelog: $NEW_VERSION"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          npm_config_legacy_peer_deps: false

      - name: Format, lint, and test affected packages
        run: npx nx run-many -t format,lint,test --projects=${{ github.event.inputs.target }}

      - name: Build all projects
        run: npx nx run-many -t build

      # This line is needed for nx affected to work when CI is running on a PR
      - name: Set up main branch tracking
        run: git branch --track main origin/main
        if: ${{ github.event_name == 'pull_request' }}

      - name: Changelog and publish packages
        if: ${{ github.ref == 'refs/heads/main' || contains(github.ref, '@v') }}
        run: |
          npx nx release changelog ${{ steps.version.outputs.number }} \
            --projects=${{ github.event.inputs.target }} \
            ${{ github.event.inputs.first_release == 'true' && '--first-release' || '' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          if [ "${{ steps.channel.outputs.is_channel }}" != "true" ]; then
            npx nx release publish \
              --projects=${{ github.event.inputs.target }} \
              ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          fi
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          npm_config_legacy_peer_deps: false

      - name: Publish channel release to npm
        if: ${{ steps.channel.outputs.is_channel == 'true' && (github.ref == 'refs/heads/main' || contains(github.ref, '@v')) }}
        run: npx nx release publish --projects=${{ github.event.inputs.target }} --tag=${{ steps.channel.outputs.name }} ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          npm_config_legacy_peer_deps: false

      - name: Upload build files
        uses: actions/upload-artifact@v7
        if: github.event.inputs.dry_run == 'true'
        with:
          name: build
          path: packages/${{ steps.pkg.outputs.dir }}
